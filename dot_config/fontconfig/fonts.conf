<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <alias binding="strong">
        <family>monospace</family>
        <prefer>
            <family>HackGen Console NF</family>
            <family>0xProto Nerd Font</family>
            <family>Noto Sans Mono CJK JP</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>sans-serif</family>
        <prefer>
            <family>M+ 1p</family>
            <family>Noto Sans CJK JP</family>
            <family>Noto Sans</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>serif</family>
        <prefer>
            <family>Noto Serif CJK JP</family>
            <family>Noto Serif</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>system-ui</family>
        <prefer>
            <family>M+ 1p</family>
            <family>Noto Sans CJK JP</family>
            <family>Noto Sans</family>
        </prefer>
    </alias>

    <!-- Some bitmap fonts advertise themselves as "System" and can outrank
         the generic system-ui alias. Assign the intended UI family directly. -->
    <match target="pattern">
        <test name="family" qual="any">
            <string>system</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>M+ 1p</string>
        </edit>
    </match>

    <match>
        <test name="family">
            <string>serif</string>
        </test>
        <edit name="family" mode="prepend" binding="weak">
            <string>Emoji</string>
        </edit>
    </match>
    <match>
        <test name="family">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="prepend" binding="weak">
            <string>Emoji</string>
        </edit>
    </match>
    <match>
        <test name="family">
            <string>monospace</string>
        </test>
        <edit name="family" mode="prepend" binding="weak">
            <string>Emoji</string>
        </edit>
    </match>
    <match>
        <test name="family">
            <string>system-ui</string>
        </test>
        <edit name="family" mode="prepend" binding="weak">
            <string>Emoji</string>
        </edit>
    </match>

    <match target="scan">
        <test name="family" compare="contains">
            <string>HackGen</string>
        </test>
        <edit name="spacing" mode="assign">
            <int>100</int>
        </edit>
    </match>

    <match target="font">
        <edit name="antialias" mode="assign"><bool>true</bool></edit>
        <edit name="hinting" mode="assign"><bool>true</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
        <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
        <edit name="rgba" mode="assign"><const>rgb</const></edit>
    </match>
</fontconfig>
