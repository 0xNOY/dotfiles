[font]
size = 12

[font.normal]
family = "0xProto Nerd Font"

[window]
opacity = 0.5
padding = { x = 0, y = 0 }
dynamic_padding = false

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[colors.primary]
background = "#202020"
foreground = "#d8d8d8"

[colors.normal]
black = "#151515"
red = "#ac4142"
green = "#90a959"
yellow = "#f4bf75"
blue = "#6a9fb5"
magenta = "#aa759f"
cyan = "#75b5aa"
white = "#d0d0d0"

[colors.bright]
black = "#505050"
red = "#ac4142"
green = "#90a959"
yellow = "#f4bf75"
blue = "#6a9fb5"
magenta = "#aa759f"
cyan = "#75b5aa"
white = "#f5f5f5"
